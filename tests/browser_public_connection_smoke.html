<!doctype html>
<meta charset="utf-8">
<title>p2pdc public C++ connection test</title>
<body data-result="pending">pending</body>
<script>
const previousError = console.error;
console.error = (...args) => {
    document.body.dataset.debug = (document.body.dataset.debug || '') + args.join(' ') + ' | ';
    previousError(...args);
};
window.addEventListener('error', event => {
    document.body.dataset.result = 'fail'; document.body.textContent = `fail: ${event.message}`;
});
window.addEventListener('unhandledrejection', event => {
    document.body.dataset.result = 'fail'; document.body.textContent = `fail: ${event.reason}`;
});
</script>
<script src="../build-wasm-auth/p2pdc_browser_public_connection_smoke.js"></script>
