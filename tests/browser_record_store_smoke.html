<!doctype html>
<meta charset="utf-8">
<title>p2pdc browser record store smoke test</title>
<body data-result="pending">pending</body>
<script>
var Module = { printErr: (...values) => {
    document.body.dataset.debug = (document.body.dataset.debug || '') + values.join(' ') + '; '; console.error(...values);
} };
window.addEventListener('error', (event) => {
    document.body.dataset.result = 'fail'; document.body.textContent = `fail: ${event.message}`;
});
window.addEventListener('unhandledrejection', (event) => {
    document.body.dataset.result = 'fail'; document.body.textContent = `fail: ${event.reason}`;
});
</script>
<script src="../build-wasm-auth/p2pdc_browser_record_store_smoke.js"></script>
