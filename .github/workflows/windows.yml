name: Windows

# Builds and tests the library on Windows, in MSYS2. Each platform has its own workflow, so each
# reports, shows its logs and can be re-run as soon as it finishes, apart from the others.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf automake libtool
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-nettle mingw-w64-ucrt-x86_64-argon2 mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-gtest mingw-w64-ucrt-x86_64-gdb
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix-windows
          key: deps-windows-${{ hashFiles('deps/**', 'patches/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake --workflow --preset deps-windows
      - name: Build
        run: |
          export PATH="$PWD/build/prefix-windows/bin:$PATH"
          cmake --preset windows
          cmake --build --preset windows
      - name: Repeat the echo example test, showing every thread's stack if one hangs
        # About one local connection in a hundred stalls in SCTP after DTLS on Windows (run
        # 45592941939); this test stalled most often. It gives up after 30 s; a run takes 1 s.
        run: |
          export PATH="$PWD/build/prefix-windows/bin:$PATH"
          tools/backtrace-hung-test.sh build/windows/p2pdc_native_transport_tests \
            'NativeEchoExampleTest.SharedExampleExchangesAndReportsDirectRoute' 30 20
      - name: Test
        run: |
          export PATH="$PWD/build/prefix-windows/bin:$PATH"
          ctest --preset windows
